[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEON_BRANCH is a branch name (often "production"), not a credential.
  # The Next.js app uses DATABASE_URL. Keep this omit so docs that say
  # "production" do not fail Netlify secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEON_BRANCH"
  SECRETS_SCAN_OMIT_PATHS = ".agents/**,.claude/**,.windsurf/**"
